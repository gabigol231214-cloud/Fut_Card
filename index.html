<style>
/* Layout: cabeçalho fixo de marca, uma coluna central; cartas brancas, pretas e amarelas com canto cortado */
:root{--bg:#0a0a0a;--panel:#151515;--line:#2c2c2c;--fg:#f4f4ee;--mut:#9b9b92;--y:#ffd60a;--ink:#0a0a0a;--w:#f4f4ee;--disp:'Anton','Impact','Arial Narrow',sans-serif;--body:'Archivo','Helvetica Neue',Arial,sans-serif;color-scheme:dark}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:15px/1.45 var(--body);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
#wrap{max-width:920px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:2px solid var(--w);margin-bottom:18px}
.brand{font:28px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.brand b{background:var(--y);color:var(--ink);padding:0 8px;margin-left:4px;font-weight:400}
.tag{font:12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
h1,h2,h3{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(44px,12vw,96px);line-height:.95}
h2{font-size:30px;line-height:1}
h3{font-size:20px}
p{margin:0}
.y{color:var(--y)}
.mut{color:var(--mut)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:0;cursor:pointer;background:var(--y);color:var(--ink);font:20px/1 var(--disp);letter-spacing:.05em;text-transform:uppercase;padding:14px 22px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.btn:hover{background:#fff}
.btn:focus-visible,.card:focus-visible,.tac:focus-visible{outline:3px solid var(--w);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--w)}
.btn.ghost:hover{background:var(--w);color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--line);padding:16px}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:12px;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.rules .k{font:18px var(--disp);color:var(--y);min-width:64px;text-transform:uppercase}
/* cartas */
.card{position:relative;aspect-ratio:3/4.1;min-width:0;padding:10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:0;font-family:var(--body);cursor:pointer;overflow:hidden;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);transition:transform .15s}
.card:hover{transform:translateY(-4px)}
.card .ovr{font:40px/.9 var(--disp)}
.card .pos{font:14px var(--disp);letter-spacing:.1em}
.card .ini{position:absolute;right:-4px;top:30%;font:90px/1 var(--disp);opacity:.12;pointer-events:none}
.card .nm{font:800 14px/1.1 var(--body);text-transform:uppercase;overflow-wrap:anywhere}
.card .meta{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;margin-top:3px}
.r-C{background:var(--w);color:var(--ink)}
.r-R{background:#111;color:var(--fg);box-shadow:inset 0 0 0 3px var(--y)}
.r-R .ovr,.r-R .pos{color:var(--y)}
.r-L{background:var(--y);color:var(--ink)}
.rl{position:absolute;top:10px;right:24px;font:11px var(--body);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.card.static{cursor:default}.card.static:hover{transform:none}
/* campo */
.pitch{position:relative;width:100%;aspect-ratio:3/3.4;max-height:640px;background:#0f0f0f;border:2px solid var(--w);overflow:hidden}
.pitch::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(244,244,238,.25)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid rgba(244,244,238,.25);border-radius:50%;transform:translate(-50%,-50%)}
.chip{position:absolute;width:19%;transform:translate(-50%,-50%);text-align:center;z-index:1}
.chip .box{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1/1.05;font:22px/1 var(--disp)}
.chip .box small{font:700 9px/1 var(--body);letter-spacing:.08em;margin-top:3px}
.chip .n{font:700 10px/1.1 var(--body);text-transform:uppercase;margin-top:3px;background:#000;padding:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.empty .box{border:2px dashed #555;color:#555;background:transparent}
.chip.now .box{outline:3px solid var(--y);outline-offset:2px;color:var(--y);border-color:var(--y)}
.bonus{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:8px 0}
.bonus b{color:var(--y);font-family:var(--disp);font-weight:400;font-size:18px}
.big{font:clamp(56px,16vw,110px)/.9 var(--disp);color:var(--y)}
.bar{height:6px;background:var(--line);margin:8px 0 0}.bar i{display:block;height:100%;background:var(--y)}
input.txt{font:20px var(--disp);letter-spacing:.04em;text-transform:uppercase;background:#000;color:var(--fg);border:2px solid var(--w);padding:12px 14px;width:100%;min-width:0}
input.txt:focus-visible{outline:3px solid var(--y)}
/* tabelas */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th{font:12px var(--body);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:right;padding:6px 8px;border-bottom:2px solid var(--w)}
td{padding:8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr.me td{background:var(--y);color:var(--ink);font-weight:800}
tr.q td:first-child{box-shadow:inset 4px 0 0 var(--w)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
/* partida */
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.score .tn{font:22px/1.05 var(--disp);text-transform:uppercase;overflow-wrap:anywhere}
.score .sc{font:clamp(56px,18vw,96px)/1 var(--disp);font-variant-numeric:tabular-nums}
.clock{font:26px var(--disp);color:var(--y);text-align:center;letter-spacing:.06em}
.feed{display:flex;flex-direction:column;gap:6px;min-height:84px}
.feed div{display:flex;gap:10px;border-left:4px solid var(--y);padding:4px 10px;background:var(--panel)}
.feed .m{font:700 14px var(--body);min-width:38px;color:var(--y)}
.feed .opp{border-left-color:var(--w)}.feed .opp .m{color:var(--w)}
.tacs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tac{appearance:none;text-align:left;cursor:pointer;background:var(--panel);color:var(--fg);border:2px solid var(--w);padding:12px;font-family:var(--body);display:flex;flex-direction:column;gap:4px}
.tac:hover{background:var(--y);color:var(--ink);border-color:var(--y)}
.tac b{font:20px var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.tac span{font-size:13px;opacity:.85}
.banner{font:clamp(36px,10vw,64px)/1 var(--disp);text-transform:uppercase;text-align:center;padding:14px;background:var(--y);color:var(--ink)}
.banner.l{background:var(--w)}.banner.d{background:#333;color:var(--fg)}
/* cartas viradas */
.fcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:560px}
.fc{perspective:900px;aspect-ratio:3/4.1;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.fc .in{position:relative;display:block;width:100%;height:100%;transition:transform .7s,opacity .5s;transform-style:preserve-3d}
.fc.open .in{transform:rotateY(180deg)}
.fc.dim .in{opacity:.4}
.fc:not(.open):hover .in{transform:translateY(-4px)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.face.back{background:repeating-linear-gradient(135deg,var(--y) 0 14px,#e6bf00 14px 28px);color:var(--ink)}
.face.back b{font:clamp(54px,16vw,96px)/1 var(--disp);font-weight:400}
.face.back i{font:normal 13px var(--disp);letter-spacing:.14em;text-transform:uppercase}
.face.front{transform:rotateY(180deg);background:#0a0a0a;color:var(--w);border:3px solid var(--w)}
.face.front small{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--y)}
.face.front b{font:clamp(26px,8vw,44px)/1 var(--disp);font-weight:400;text-transform:uppercase;overflow-wrap:anywhere}
.face.front b.sm{font-size:clamp(18px,5.4vw,28px)}
.bonus b.neg{color:var(--w)}
@media(prefers-reduced-motion:reduce){.card,.fc .in{transition:none}}
</style>

function cardHTML(c,attrs='',cls=''){

function surname(n){const p=n.split(' ');return p[p.length-1]}
function chipHTML(x,y,w,c){
  const r=rar(c.ovr);
  return `<div class="chip" style="left:${x}%;top:${y}%;width:${w}%"><div class="box r-${r}">${c.ovr}<small>${POS[c.pos]}</small></div><div class="n">${esc(surname(c.name))}</div></div>`}
function pitchHTML(ids){
  const t=ids.map(i=>CARDS[i]),g={G:[],D:[],M:[],A:[]};
  t.forEach(c=>g[c.pos==='Z'||c.pos==='L'?'D':c.pos].push(c));
  const lats=g.D.filter(c=>c.pos==='L'),zags=g.D.filter(c=>c.pos==='Z');
  g.D=lats.length?[lats[0],...zags,...lats.slice(1)]:zags;
  const Y={G:86,D:66,M:44,A:16};let out='';
  for(const k of ['G','D','M','A']){const n=g[k].length;g[k].forEach((c,i)=>out+=chipHTML((i+1)*100/(n+1),Y[k],Math.min(19,86/n),c))}
  return `<div class="pitch">${out}</div>`}

function power(ids){
  const t=ids.map(i=>CARDS[i]);
  const avg=t.reduce((s,c)=>s+c.ovr,0)/t.length;
  const bonus=[];let b=0;const add=(l,v)=>{b+=v;bonus.push([l,v])};
  const cnt=k=>{const m={};t.forEach(c=>{if(!NOCHEM.includes(c[k]))m[c[k]]=(m[c[k]]||0)+1});return m};
  for(const [r,n] of Object.entries(cnt('reg'))){const v=n>=7?3:n>=5?2:n>=3?1:0;if(v)add(`${n} jogadores de ${REG[r]}`,v)}
  for(const [c,n] of Object.entries(cnt('club'))){if(n>=2)add(`${n} jogadores do ${c}`,Math.min(n-1,3)*0.6)}
  const atk=t.filter(c=>c.pos==='A');
  if(atk.length===3&&atk.every(c=>c.reg===atk[0].reg))add(`Trio de ataque de ${REG[atk[0].reg]}`,1.5);
  for(const c of Object.keys(CLUB)){const s=t.filter(x=>x.club===c);if(['G','Z','M','A'].every(p=>s.some(x=>x.pos===p)))add(`Espinha dorsal do ${c}`,2)}
  if(t.filter(c=>rar(c.ovr)==='L').length>=3)add('Três ou mais cartas lendárias',1);
  const g=t.filter(c=>c.pos==='G').length,d=t.filter(c=>c.pos==='Z'||c.pos==='L').length,m=t.filter(c=>c.pos==='M').length,a=atk.length;
  if(g===0)add('Sem goleiro',-8);
  if(g>1)add(`${g} goleiros no time`,-3*(g-1));
  if(d<3)add(`Poucos defensores (${d})`,-2.5*(3-d));
  if(m<3)add(`Poucos meias (${m})`,-2*(3-m));
  if(a<2)add(`Poucos atacantes (${a})`,-2*(2-a));
  if(g===1&&d>=3&&m>=3&&a>=2)add('Time equilibrado',1.5);
  return{avg,bonus,b,total:avg+b}}

const TYPES=['cor','letra','time','lenda','bola','liga','sm','free','pos','regiao'];
function mkRules(type){
  const o=[];
  if(type==='cor')Object.keys(CN).forEach(k=>o.push({ty:'Cor do clube',big:CN[k],txt:`Jogador de um clube ${CN[k]}`,f:c=>clubCol(c)===k}));
  if(type==='letra')'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(L=>o.push({ty:'Letra',big:L,txt:`Jogador cujo nome começa com ${L}`,f:c=>norm(c.name)===L}));
  if(type==='time')Object.keys(CLUB).forEach(k=>o.push({ty:'Time',big:k,txt:`Jogador do ${k}`,f:c=>c.club===k}));
  if(type==='lenda')o.push({ty:'Aposentado',big:'Lenda',txt:'Jogador aposentado',f:c=>c.tag.includes('R')});
  if(type==='bola')o.push({ty:'Bola de Ouro',big:'Bola de Ouro',txt:'Jogador que já ganhou a Bola de Ouro',f:c=>c.tag.includes('B')});
  if(type==='liga')Object.keys(LGN).forEach(k=>o.push({ty:'Liga',big:LGN[k],txt:`Jogador que joga na liga: ${LGN[k]}`,f:c=>clubLg(c)===k}));
  if(type==='sm')o.push({ty:'País',big:'San Marino',txt:'Jogador de San Marino',f:c=>c.tag.includes('S')});
  if(type==='free')o.push({ty:'Contrato',big:'Sem clube',txt:'Jogador sem clube',f:c=>c.tag.includes('F')});
  if(type==='pos')Object.keys(POSN).forEach(k=>o.push({ty:'Posição',big:POSN[k],txt:`Jogador na posição de ${POSN[k].toLowerCase()}`,f:c=>c.pos===k}));
  if(type==='regiao')Object.keys(REG).forEach(k=>o.push({ty:'Região',big:REG[k],txt:`Jogador da região: ${REG[k]}`,f:c=>c.reg===k}));
  return o}
const poolOf=r=>CARDS.filter(c=>!S.picks.includes(c.id)&&r.f(c));
function newRules(){
  const out=[];
  for(const ty of shuffle(TYPES)){
    const r=shuffle(mkRules(ty)).find(x=>poolOf(x).length>=3);
    if(r)out.push(r);
    if(out.length===3)break}
  S.rules=out;S.opened=-1}

function buildCup(name,str){
  const opp=shuffle(OPP).slice(0,15).map((o,i)=>({id:i+1,name:o[0],str:o[2]+2+rnd(3)-1,style:pick(['P','Q','C','R'])}));
  const me={id:0,name,str,you:true};
  const all=shuffle([me,...opp]);
  return{name,me,all,groups:[0,1,2,3].map(g=>all.slice(g*4,g*4+4)),res:[],md:0,stage:'G',games:null,log:[],round:null}}

function lam(sa,sb,ta,tb){
  let x=(sa-sb)/10;
  if(BEATS[ta]===tb)x+=.28;
  if(BEATS[tb]===ta)x-=.28;
  let la=1.3*Math.exp(x),lb=1.3*Math.exp(-x);
  if(ta==='R'){la*=.85;lb*=.8}
  if(tb==='R'){lb*=.85;la*=.8}
  return[la,lb]}
function shoot(sa,sb){
  let pa=0,pb=0;const qa=.74+(sa-sb)/200,qb=.74-(sa-sb)/200;
  for(let i=0;i<5;i++){if(Math.random()<qa)pa++;if(Math.random()<qb)pb++}
  while(pa===pb){if(Math.random()<qa)pa++;if(Math.random()<qb)pb++}
  return[pa,pb]}
function scorer(t){
  if(!t.you)return'#'+pick([9,10,11,7,8,19,21,14]);
  const pool=S.picks.map(i=>CARDS[i]),w={A:5,M:2.5,L:.6,Z:.5,G:0};
  const wt=c=>w[c.pos]*c.ovr/80;
  let r=Math.random()*pool.reduce((s,c)=>s+wt(c),0);
  for(const c of pool){r-=wt(c);if(r<=0)return c.name}
  return pool[pool.length-1].name}
function playMatch(a,b,ta,tb,ko){
  const[la,lb]=lam(a.str,b.str,ta,tb);
  let ga=pois(la),gb=pois(lb);const ev=[];
  const add=(n,t,lo,hi)=>{for(let i=0;i<n;i++)ev.push({m:lo+rnd(hi-lo+1),t,who:scorer(t==='a'?a:b)})};
  add(ga,'a',1,90);add(gb,'b',1,90);
  let pen=null,et=false;
  if(ko&&ga===gb){
    et=true;const ea=pois(la*.3),eb=pois(lb*.3);ga+=ea;gb+=eb;add(ea,'a',91,120);add(eb,'b',91,120);
    if(ga===gb)pen=shoot(a.str,b.str)}
  ev.sort((x,y)=>x.m-y.m);
  const w=ga>gb?a:gb>ga?b:pen?(pen[0]>pen[1]?a:b):null;
  return{a,b,ga,gb,ev,pen,et,w}}

function table(g,res){
  const m={};g.forEach(t=>m[t.id]={t,p:0,w:0,d:0,l:0,gf:0,ga:0,pl:0});
  res.filter(r=>r.g&&m[r.a]&&m[r.b]).forEach(r=>{
    const A=m[r.a],B=m[r.b];A.pl++;B.pl++;A.gf+=r.ga;A.ga+=r.gb;B.gf+=r.gb;B.ga+=r.ga;
    if(r.ga>r.gb){A.p+=3;A.w++;B.l++}else if(r.ga<r.gb){B.p+=3;B.w++;A.l++}else{A.p++;B.p++;A.d++;B.d++}});
  return Object.values(m).sort((x,y)=>y.p-x.p||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||y.t.str-x.t.str)}
function tableHTML(g,c){
  const rows=table(g,c.res);
  return`<div class="tw"><table><thead><tr><th>Time</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>Pts</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.t.you?'me':''} ${i<2?'q':''}"><td>${esc(r.t.name)}</td><td>${r.pl}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf-r.ga}</td><td>${r.p}</td></tr>`).join('')}</tbody></table></div>`}

function nextOpp(){
  const c=S.cup,me=c.me;
  if(c.stage==='G'){
    const g=c.groups.find(x=>x.includes(me));
    const fx=FIX[c.md].find(([i,j])=>g[i]===me||g[j]===me);
    return g[fx[0]]===me?g[fx[1]]:g[fx[0]]}
  const gm=c.games.find(x=>x.includes(me));
  return gm[0]===me?gm[1]:gm[0]}
const nm=t=>t.you?`<span class="y">${esc(t.name)}</span>`:esc(t.name);

function cupScreen(){
  const c=S.cup,me=c.me,opp=nextOpp();
  window.scrollTo(0,0);
  if(c.stage==='G'){
    setTag(`Fase de grupos · rodada ${c.md+1} de 3`);
    const gi=c.groups.findIndex(g=>g.includes(me));
    app.innerHTML=`<div class="stack">
      <div class="row" style="justify-content:space-between"><div><div class="tag">Seu grupo · os 2 primeiros avançam</div><h2>Grupo ${'ABCD'[gi]}</h2></div><button class="btn" id="play">Jogar vs ${esc(opp.name)}</button></div>
      ${tableHTML(c.groups[gi],c)}
      <h3>Outros grupos</h3>
      <div class="groups">${c.groups.map((g,i)=>i===gi?'':`<div class="panel"><div class="tag" style="margin-bottom:6px">Grupo ${'ABCD'[i]}</div>${tableHTML(g,c)}</div>`).join('')}</div></div>`;
  }else{
    setTag(KO_NAMES[c.round]);
    app.innerHTML=`<div class="stack">
      <div class="row" style="justify-content:space-between"><div><div class="tag">Mata-mata</div><h2>${KO_NAMES[c.round]}</h2></div><button class="btn" id="play">Jogar vs ${esc(opp.name)}</button></div>
      <div class="panel"><h3 style="margin-bottom:6px">Jogos desta fase</h3>${c.games.map(gm=>`<div class="bonus"><span>${nm(gm[0])}</span><span class="mut">x</span><span>${nm(gm[1])}</span></div>`).join('')}</div>
      ${c.log.slice().reverse().map(l=>`<div class="panel"><h3 style="margin-bottom:6px">${KO_NAMES[l.round]}</h3>${l.rr.map(r=>`<div class="bonus"><span>${nm(r.a)} ${r.ga} x ${r.gb} ${nm(r.b)}${r.pen?` <span class="mut">(pên. ${r.pen[0]} x ${r.pen[1]})</span>`:''}</span></div>`).join('')}</div>`).join('')}</div>`}
  $('#play').onclick=prematch}

function prematch(){
  const c=S.cup,me=c.me,opp=nextOpp(),ko=c.stage==='K';
  window.scrollTo(0,0);
  setTag(ko?KO_NAMES[c.round]:`Rodada ${c.md+1}`);
  app.innerHTML=`<div class="stack">
    <div class="score"><div class="tn">${nm(me)}<div class="tag">Força ${f1(me.str)}</div></div><div class="sc" style="font-size:40px">X</div><div class="tn">${esc(opp.name)}<div class="tag">Força ${f1(opp.str)}</div></div></div>
    <div class="panel"><span class="tag">Estilo provável do rival</span><h3 class="y" style="margin-top:4px">${TAC[opp.style][0]}</h3><p class="mut">${TAC[opp.style][1]}</p></div>
    <div><div class="tag" style="margin-bottom:8px">Escolha sua tática</div><div class="tacs">${Object.keys(TAC).map(k=>`<button class="tac" data-k="${k}"><b>${TAC[k][0]}</b><span>${TAC[k][1]}</span></button>`).join('')}</div></div></div>`;
  document.querySelectorAll('.tac').forEach(b=>b.onclick=()=>{
    const ta=b.dataset.k,tb=Math.random()<.65?opp.style:pick(Object.keys(TAC));
    animate(playMatch(me,opp,ta,tb,ko),ta,tb)})}

function animate(res,ta,tb){
  const c=S.cup,me=res.a,op=res.b;let m=0,ga=0,gb=0,i=0,done=false;
  const adv=BEATS[ta]===tb?'Vantagem tática sua':BEATS[tb]===ta?'Vantagem tática do rival':'Sem vantagem tática';
  app.innerHTML=`<div class="stack">
    <div class="tag">Sua tática: ${TAC[ta][0]} · Rival: ${TAC[tb][0]} · ${adv}</div>
    <div class="score"><div class="tn">${esc(me.name)}</div><div class="sc"><span id="sa">0</span> x <span id="sb">0</span></div><div class="tn">${esc(op.name)}</div></div>
    <div class="clock" id="ck">0'</div><div class="feed" id="fd"></div><div id="fin"></div>
    <div class="row" id="ctl"><button class="btn ghost" id="skip">Pular</button></div></div>`;
  const maxM=res.et?120:90;
  const finish=()=>{
    if(done)return;done=true;
    const win=res.w===me,draw=!res.w;
    $('#fin').innerHTML=`<div class="banner ${win?'':draw?'d':'l'}">${win?'Vitória':draw?'Empate':'Derrota'}</div>${res.pen?`<div class="tag" style="text-align:center;margin-top:8px">Pênaltis: ${res.pen[0]} x ${res.pen[1]}</div>`:''}`;
    $('#ctl').innerHTML='<button class="btn" id="nx">Continuar</button>';
    $('#nx').onclick=()=>afterMatch(res)};
  let t;
  const step=()=>{
    m++;
    while(i<res.ev.length&&res.ev[i].m<=m){
      const e=res.ev[i++];if(e.t==='a')ga++;else gb++;
      $('#sa').textContent=ga;$('#sb').textContent=gb;
      $('#fd').insertAdjacentHTML('beforeend',`<div class="${e.t==='a'?'':'opp'}"><span class="m">${e.m}'</span><span>Gol de ${esc(e.who)} (${esc(e.t==='a'?me.name:op.name)})</span></div>`)}
    $('#ck').textContent=m>90?`Prorrogação ${m}'`:`${m}'`;
    if(m>=maxM){clearInterval(t);finish()}};
  t=setInterval(step,55);
  $('#skip').onclick=()=>{clearInterval(t);while(m<maxM)step()}}

function afterMatch(res){
  const c=S.cup,me=c.me;
  if(c.stage==='G'){
    c.res.push({a:me.id,b:res.b.id,ga:res.ga,gb:res.gb,g:1});
    c.groups.forEach(g=>FIX[c.md].forEach(([i,j])=>{
      const A=g[i],B=g[j];if(A.you||B.you)return;
      const r=playMatch(A,B,0,0,false);c.res.push({a:A.id,b:B.id,ga:r.ga,gb:r.gb,g:1})}));
    c.md++;
    if(c.md<3){cupScreen();return}
    const tabs=c.groups.map(g=>table(g,c.res));
    const mine=tabs.find(t=>t.some(r=>r.t.you));
    const pos=mine.findIndex(r=>r.t.you);
    if(pos>1){end('group',pos+1);return}
    const W=tabs.map(t=>t[0].t),R=tabs.map(t=>t[1].t);
    c.stage='K';c.round='QF';
    c.games=[[W[0],R[1]],[W[2],R[3]],[W[1],R[0]],[W[3],R[2]]];
    cupScreen();return}
  const rr=c.games.map(gm=>gm.includes(me)?res:playMatch(gm[0],gm[1],0,0,true));
  c.log.push({round:c.round,rr});
  if(res.w!==me){end('ko',c.round);return}
  if(c.round==='F'){end('champ');return}
  const ws=rr.map(r=>r.w);
  if(c.round==='QF'){c.round='SF';c.games=[[ws[0],ws[1]],[ws[2],ws[3]]]}
  else{c.round='F';c.games=[[ws[0],ws[1]]]}
  cupScreen()}

function end(kind,x){
  const c=S.cup;window.scrollTo(0,0);
  let head,sub;
  if(kind==='champ'){addTitle();setTag('Campeão');head=`<div class="big">Campeão<br>do mundo</div>`;sub=`${esc(c.name)} levantou a taça. Títulos conquistados: ${titles()}.`}
  else if(kind==='group'){setTag('Eliminado');head=`<div class="big" style="color:var(--w)">Eliminado</div>`;sub=`${esc(c.name)} terminou em ${x}º lugar no grupo e não avançou.`}
  else{setTag('Eliminado');head=`<div class="big" style="color:var(--w)">Eliminado</div>`;sub=`${esc(c.name)} caiu nas ${KO_NAMES[x].toLowerCase()}.`}
  app.innerHTML=`<div class="stack">${head}<p style="max-width:52ch">${sub}</p>
    <div style="max-width:420px;width:100%">${pitchHTML(S.picks,-1)}</div>
    <div class="row"><button class="btn" id="n1">Novo draft</button><button class="btn ghost" id="n2">Jogar a Copa de novo com este time</button></div></div>`;
  $('#n1').onclick=startDraft;
  $('#n2').onclick=()=>{S.cup=buildCup(c.name,S.pw.total);cupScreen()}}

home();
</script>
